<h2>Pagar Compra</h2>

<div class="total-container">
  <div class="compra-details">
    <h3>Id de compra: #{{compra.id}}</h3>
    <p>Fecha: {{formatearFecha(compra.fecha)}}</p>
    <div class="producto-container">
      @for(item of compra.productos; track item.idProducto){
        <img class="img-producto" [src]="getPrimerImagen(item.producto!)" alt="">
        <div class="product-details">
          <p class="titles-main">{{item.producto?.nombre}}</p>
          <p>Precio: ${{item.producto?.precio}}</p>
          <p>Cantidad: {{item.cantidad}}</p>
        </div>
      }
    </div>
  </div>
  <div class="payment-container">
    <h3 class="title-pay">Pagar con Mercado Pago</h3>
    <!-- <img src="front\luzYArmoniaProyect\src\app\shared\images\MP_RGB_HANDSHAKE_color_horizontal.png" alt="mercado pago"> -->
    <hr>
    <p class="total">Total a pagar: ${{compra.total}}</p>
    <button (click)="pagar()">Pagar</button>
  </div>
</div>
