<h2>
  {{modo === 'crear' ? 'Agregar Producto': 'Editar Producto'}}
</h2>

<form class="form-product" [formGroup]="formProduct" (ngSubmit)="sendProduct()">
<div class="inputs-container">

  <label for="tipo-producto">Tipo de producto:
    @if(isInvalid('idTipoProducto')){
    <span class="error">*El tipo de producto es obligatorio</span>
  }
  </label>
  <select id="tipo-producto" formControlName="idTipoProducto">
    <option [ngValue]="null" disabled >-- Seleccione un producto --</option>
    @for(tipo of tiposDeProductos; track tipo.id){
      <option [value]="tipo.id">{{tipo.tipo}}</option>
    }
  </select>

  <div class="two-inputs">
    <div class="labels-column">
      <label for="name">Nombre:
        @if(isInvalid('nombre')){
            <span class="error">*El nombre es obligatorio</span>
        }
      </label>
      <input type="text" id="name" formControlName="nombre" placeholder="Nombre del producto">
    </div>

    <div class="labels-column">
      <label for="arom">Aroma:
        @if(isInvalid('idAroma')){
          <span class="error">*El aroma es obligatorio</span>
        }
      </label>
      <select formControlName="idAroma" id="arom">
        <option [ngValue]="null" disabled>-- Seleccione un aroma --</option>
        @for(aroma of aromas; track aroma.id){
          <option [ngValue]="aroma.id">{{aroma.aroma}}</option>
        }
      </select>
    </div>
  </div>


  <label for="des">Descripción:
    @if(isInvalid('descripcion')){
      <span class="error">*La descripcion es obligatoria</span>
    }
  </label>
  <input type="text" id="des" formControlName="descripcion" placeholder="Descripcion del producto">

  <div class="two-inputs">
    <div class="labels-column">
      <label for="price">Precio:
        @if(isInvalid('precio')){
            <span class="error">*El precio es obligatorio</span>
        }
      </label>
      <input type="number" formControlName="precio" id="price" placeholder="Precio del producto por unidad">
    </div>

    <div class="labels-column">
      <label for="stck">Stock:
        @if(isInvalid('stock')){
            <span class="error">*El stock es obligatorio</span>
        }
      </label>
      <input type="number" formControlName="stock" id="stck" placeholder="Stock del producto">
    </div>
  </div>

  @if(mostrarTamanio){
    <div class="two-inputs">
      <div class="labels-column">
        <label for="size-h">Alto:
          @if(isInvalid('alto')){
            <span class="error">*La altura es obligatoria</span>
          }
        </label>
        <input type="number" formControlName="alto" id="size-h" placeholder="Alto del producto en cm">
      </div>

      <div class="labels-column">
        <label for="size-w">Ancho:
          @if(isInvalid('ancho')){
            <span class="error">*El ancho es obligatorio</span>
          }
        </label>
        <input type="number" formControlName="ancho" id="size-w" placeholder="Ancho del producto en cm">
      </div>
    </div>
  } @else {
    <label for="size-m">Mililitros:
      @if(isInvalid('mililitros')){
        <span class="error">*Los mililitros son obligatorios</span>
      }
    </label>
    <input type="number" formControlName="mililitros" id="size-m" placeholder="Cantidad de mililitros del producto">
  }

  <div>
    <label for="isPrem">Premium</label>
    <input type="checkbox" formControlName="premium" id="isPrem">
  </div>

  <button type="submit">
    {{modo === 'crear' ? 'Agregar' : 'Actualizar'}}
  </button>
</div>
<div class="image-container">
  <label for="img">Imagenes:</label>
  <input type="file" id="img" multiple accept="image/*" (change)="onImagesSelected($event)">
</div>
</form>
