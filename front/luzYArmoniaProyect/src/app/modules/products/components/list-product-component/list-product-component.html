<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="products-container">
  @for(producto of productos; track producto.id){
    <div (click)="verProducto(producto.id)" class="product">
      <div class="admin-buttons">
        @if(admin){
          <p-button (onClick)="redirectToUpdate(producto.id)"  icon="pi pi-pencil" severity="warn"/>
          <p-button (onClick)="activarMensajeAlertaDelete(producto)" icon="pi pi-trash" severity="danger" />
        } @else{
          <span class="material-symbols-outlined">
            add_shopping_cart
            </span>
          <span class="material-symbols-outlined">
            favorite
          </span>
        }
      </div>
      <div class="img-container">
          <img [src]="getPrimerImagen(producto)" alt="">

      </div>
      <div class="products-flags">
        @if(producto.premium){
          <span class="premium">
            <span class="material-symbols-outlined">
                crown</span>
            </span>
        }
        <span class="flag product-aroma">{{producto.aroma?.aroma}}</span>
      </div>
      <div class="header-product-container">
        <p class="titles-main">{{producto.nombre}}</p>
        <p class="product-price">${{producto.precio}}</p>
      </div>
    </div>
    }
</div>
